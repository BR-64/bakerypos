<!doctype html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <!-- No pinch zoom: accidental zooms at the counter break the layout. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#7c4a1e" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="icon" type="image/svg+xml" href="/icons/icon.svg" />
    <!-- iOS ignores an SVG apple-touch-icon: "Add to Home screen" would
         fall back to a screenshot of the page. The PNG is generated from
         the same SVG by scripts/generate-icons.mjs. -->
    <link rel="apple-touch-icon" href="/icons/icon-192.png" />
    <title>Bakery POS</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
